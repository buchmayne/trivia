{% extends 'studio/base.html' %}
{% block title %}Studio login{% endblock %}
{% block content %}
<section class="panel">
  <h1>Studio sandbox login</h1>
  <p class="muted">Use the staff account created for this disposable SQLite database.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next|default:'/studio/' }}">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
