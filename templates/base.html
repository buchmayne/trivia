{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trivia{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="page-wrapper">
        <header class="gallery-hero">
            <div class="gallery-hero-bg"></div>
            <div class="gallery-hero-scrim"></div>
            <div class="gallery-hero-content">
                {% block hero_eyebrow %}{% endblock %}
                {% block hero_title %}{% endblock %}
            </div>
        </header>
        <main class="container">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
