[project]
name = "trivia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.118",
    "django>=5.2.18,<6.0",
    "django-allauth>=65.19.7",
    "django-filter==26.1",
    "django-ratelimit>=4.1.0",
    "django-storages>=1.14.6",
    "django-tinymce==5.0.0",
    "djangorestframework==3.18.3",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "urllib3>=2.8.0",
]

[tool.black]
target-version = ["py313"]

[dependency-groups]
dev = [
    "black==26.10.1",
    "gspread==6.2.1",
    "numpy>=2.2.6",
    "oauth2client==4.1.3",
    "pandas>=2.3.3",
]
