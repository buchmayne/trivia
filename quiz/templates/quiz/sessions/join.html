{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Game - Third Wave Trivia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/session.css' %}">
</head>
<body class="form-page-body">
    <div class="form-page-container" style="max-width: 500px; padding-top: 3rem;">
        <h1 class="form-page-title">Join a Game</h1>

        <div class="form-card">
            <div id="error" class="error"></div>

            <!-- Shown when the name is already in the session: almost always a
                 returning player rather than a real collision. -->
            <div id="rejoinOffer" class="hidden" style="margin-bottom: 1.5rem; padding: 1rem; background: var(--shell-alt, rgba(0,0,0,0.03)); border-radius: 8px;">
                <p id="rejoinOfferText" style="margin-bottom: 0.75rem;"></p>
                <button type="button" class="btn btn-primary" id="rejoinOfferBtn" style="width: 100%; padding: 0.9rem;">
                    Yes, rejoin as this team
                </button>
                <div class="hint" style="margin-top: 0.5rem;">
                    Your score and answers are still there. If this is a different team, pick another name.
                </div>
            </div>

            <form id="joinForm">
                <div class="form-group">
                    <label for="sessionCode">Game Code</label>
                    <input
                        type="text"
                        id="sessionCode"
                        placeholder="ABC123"
                        required
                        maxlength="6"
                        pattern="[A-Z0-9]{6}"
                        style="text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; text-align: center; padding: 1rem; font-size: 1.2rem;"
                    >
                    <div class="hint">Enter the 6-character code provided by the host</div>
                </div>

                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input
                        type="text"
                        id="teamName"
                        placeholder="Enter your team name"
                        required
                        minlength="2"
                        maxlength="100"
                        style="padding: 1rem; font-size: 1.1rem;"
                    >
                    <div class="hint">Choose a unique name for your team</div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                    Join Game
                </button>
            </form>

            <a href="{% url 'quiz:session_landing' %}" class="back-link-dark" style="color: var(--text-secondary);">Back</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('joinForm');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const codeInput = document.getElementById('sessionCode');

        // Auto-uppercase code input
        codeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const code = codeInput.value.trim();
            const teamName = document.getElementById('teamName').value.trim();

            if (code.length !== 6) {
                showError('Game code must be 6 characters');
                return;
            }

            if (teamName.length < 2) {
                showError('Team name must be at least 2 characters');
                return;
            }

            // CRITICAL: Prevent host from joining their own game as a team
            const existingAdminToken = localStorage.getItem(`session_${code}_admin`);
            if (existingAdminToken) {
                showError('You are the host of this game. Please use the host view instead of joining as a team.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Joining...';

            try {
                const response = await fetch(`/quiz/api/sessions/${code}/join/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        team_name: teamName
                    })
                });

                const data = await response.json();

                // 409: the name is already in this session. Offer to rejoin
                // that team instead of dead-ending on "Team name taken".
                if (response.status === 409 && data.can_rejoin) {
                    offerRejoin(code, data.team_name || teamName);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Join Game';
                    return;
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to join session');
                }

                enterSession(code, data.team_token);

            } catch (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Join Game';
            }
        });

        function enterSession(code, teamToken) {
            // Store team token in localStorage
            localStorage.setItem(`session_${code}_team`, teamToken);
            // Set role preference to indicate this user is a team
            localStorage.setItem(`session_${code}_role`, 'team');

            // Redirect to live session (validation will clean up any conflicts)
            window.location.href = `/quiz/play/${code}/`;
        }

        function offerRejoin(code, teamName) {
            const offer = document.getElementById('rejoinOffer');
            // textContent, not innerHTML - the name comes from another player.
            document.getElementById('rejoinOfferText').textContent =
                `A team called "${teamName}" is already in this game. Is that you?`;
            offer.classList.remove('hidden');

            const btn = document.getElementById('rejoinOfferBtn');
            btn.onclick = async () => {
                btn.disabled = true;
                btn.textContent = 'Rejoining...';
                try {
                    const response = await fetch(`/quiz/api/sessions/${code}/rejoin/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ team_name: teamName })
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to rejoin session');
                    }

                    enterSession(code, data.team_token);
                } catch (error) {
                    showError(error.message);
                    offer.classList.add('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Yes, rejoin as this team';
                }
            };
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
