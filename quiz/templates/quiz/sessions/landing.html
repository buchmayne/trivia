{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third Wave Trivia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/session.css' %}">
</head>
<body class="landing-body">
    <div class="landing-container">
        <h1 class="landing-title">Third Wave Trivia</h1>
        <p class="landing-subtitle">Live trivia - compete in real time</p>

        <div class="landing-buttons">
            <a href="{% url 'quiz:session_host' %}" class="btn-landing-host">
                Host a Game
            </a>
            <a href="{% url 'quiz:session_join' %}" class="btn-landing-join">
                Join a Game
            </a>
            <a href="{% url 'quiz:session_rejoin_page' %}" class="btn-landing-join">
                Rejoin a Game
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'quiz:session_my_games' %}" class="btn-landing-join">
                My Games
            </a>
            {% endif %}
        </div>

        <a href="{% url 'home' %}" class="landing-back">Back to Home</a>
    </div>
</body>
</html>
