name: Django CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        pip install --upgrade uv
    
    - name: Install Dependencies
      run: |
        uv sync --frozen

    - name: Validate seed fixture
      env:
         DB_NAME: github_actions
         DB_USER: postgres
         DB_PASSWORD: postgres
         DB_HOST: localhost
         DB_PORT: 5432
      run: |
        uv run manage.py migrate
        uv run manage.py seed_db
        uv run manage.py seed_db
        
    - name: Run Tests
      env:
         DB_NAME: github_actions
         DB_USER: postgres
         DB_PASSWORD: postgres
         DB_HOST: localhost
         DB_PORT: 5432
      run: |
        uv run python manage.py test
        
    - name: Run linting
      run: |
        uv run black . --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Digital Ocean
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DROPLET_IP }}
        username: ${{ secrets.DROPLET_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e

          # Cleanup Docker resources. Safe to run before `docker-compose down`
          # below since the currently-running containers (and their volumes,
          # e.g. db backups / certs) are still in use and won't be touched.
          # Build cache is pruned explicitly since `system prune -a` does not
          # reliably clear BuildKit's cache, which was the main disk hog.
          # No age filters here (previously `until=72h`/`until=24h`): those
          # left recently-created but already-unused images/cache sitting
          # around, which was the main reason cleanup wasn't reclaiming
          # enough space. Anything still in use by a running container is
          # untouched regardless of age.
          docker container prune -f
          docker image prune -af
          docker builder prune -af
          docker volume prune -f
          docker network prune -f

          # Cleanup system logs
          sudo journalctl --vacuum-time=3d
          sudo apt clean

          # Fail fast with a clear message instead of a cryptic mid-build
          # "No space left on device" error if cleanup wasn't enough.
          AVAILABLE_KB=$(df --output=avail / | tail -1)
          AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
          echo "Disk space available on / after cleanup: ${AVAILABLE_GB}GB"
          if [ "$AVAILABLE_GB" -lt 2 ]; then
            echo "ERROR: Less than 2GB free on / after cleanup. Aborting deploy before build to avoid a broken half-deployed state."
            df -h
            docker system df
            exit 1
          fi

          # Update codebase
          cd ./opt/trivia/
          git fetch origin main
          # Capture current HEAD before reset so we can diff what actually changed
          PREVIOUS_HEAD=$(git rev-parse HEAD 2>/dev/null || echo "")
          git reset --hard origin/main

          # Create .env file using GitHub secrets
          echo "DEBUG=False" > .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "EMAIL_BACKEND=${{ secrets.EMAIL_BACKEND }}" >> .env
          echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env
          echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
          echo "EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}" >> .env
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env
          echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env
          echo "DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}" >> .env

          # Build the new images while the old containers are still serving
          # traffic. If the build fails (e.g. out of disk space, bad
          # Dockerfile), `set -e` stops the script here and the currently
          # running app is left untouched instead of being torn down first.
          docker-compose build

          # Only now swap over to the newly built images.
          # (existing containers/networks removed, volumes for db/certs preserved)
          docker-compose down --remove-orphans
          docker-compose up -d

          # Apply content fixture to production if content.json changed in this push.
          # PREVIOUS_HEAD was captured before the git reset above so the diff is accurate.
          # On the very first deploy PREVIOUS_HEAD will be empty; fall back to always seeding.
          CONTENT_CHANGED=false
          if [ -z "$PREVIOUS_HEAD" ]; then
            echo "No previous HEAD - treating as first deploy, will seed content."
            CONTENT_CHANGED=true
          elif git diff --name-only "$PREVIOUS_HEAD" HEAD -- quiz/fixtures/content.json | grep -q 'content.json'; then
            echo "content.json changed in this push."
            CONTENT_CHANGED=true
          else
            echo "content.json unchanged - skipping content seed."
          fi

          if [ "$CONTENT_CHANGED" = "true" ]; then
            echo "Waiting for web container to be ready..."
            # Poll until the container can run a management command (up to 90s)
            for i in $(seq 1 18); do
              if docker-compose exec -T web uv run manage.py check 2>/dev/null; then
                break
              fi
              echo "  attempt $i/18, retrying in 5s..."
              sleep 5
            done
            docker-compose exec -T web uv run manage.py seed_db --force
            echo "Content fixture applied."
          fi
